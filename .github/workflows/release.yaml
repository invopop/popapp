#
# Automatically tag a merge with master, or build a new image from the tag.
#
# Secrets required:
#  * `GCP_PROJECT_ID` - Google Cloud Project ID
#  * `GCP_SA_KEY` - JSON service account key
#

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "README.md"

env:
  REGISTRY: europe-docker.pkg.dev
  REPO_PATH: invopop/apps

# The bump step pushes the new semver tag with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  tag-build-publish:
    name: Tag, Build, Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: "0" # make sure we get all commits!

      - name: Get repo details
        run: |
          echo "COMMIT_TYPE=$(echo $GITHUB_REF | cut -d / -f 2)" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d / -f 2-)" >> $GITHUB_ENV
          echo "REPO_VERSION=$(echo $GITHUB_REF | cut -d / -f 3-)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: bump
        if: env.COMMIT_TYPE != 'tags'
        uses: anothrNick/github-tag-action@1.52.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          WITH_V: true

      # Tag-derived values are read from the shell environment rather than
      # interpolated into the script, so a crafted tag name stays data.
      - name: Set Version from Semver Tag
        if: env.COMMIT_TYPE != 'tags'
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          echo "REPO_VERSION=$NEW_TAG" >> $GITHUB_ENV

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker Credentials
        run: |
          gcloud auth configure-docker "$REGISTRY",us-docker.pkg.dev

      - name: Build
        run: |
          docker build -t "$REPO_NAME" \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg REPO_VERSION="$REPO_VERSION" \
            --build-arg GITHUB_REF="$GITHUB_REF" . \
            --build-arg GITHUB_USER="${{ secrets.GO_MOD_USER }}" \
            --build-arg GITHUB_PASS="${{ secrets.GO_MOD_PASS }}"

      - name: Tag Image
        run: |
          docker image tag "$REPO_NAME" "$REGISTRY/$REPO_PATH/$REPO_NAME:$REPO_VERSION"

      - name: Tag Latest Main Release
        if: env.COMMIT_TYPE != 'tags'
        run: |
          docker image tag "$REPO_NAME" "$REGISTRY/$REPO_PATH/$REPO_NAME:${GITHUB_REF##*/}-$REPO_VERSION-$(date +'%Y%m%dT%H%M')"
          docker image tag "$REPO_NAME" "$REGISTRY/$REPO_PATH/$REPO_NAME:latest"

      - name: Publish
        run: |
          docker image push --all-tags "$REGISTRY/$REPO_PATH/$REPO_NAME"
